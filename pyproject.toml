[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amerop"
version = "1.0.0"
description = "American option pricing: binomial trees, Longstaff-Schwartz LSMC, ML continuation values and reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["amerop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
